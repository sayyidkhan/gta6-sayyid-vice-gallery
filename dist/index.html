const grid=document.querySelector('.grid'),nav=document.querySelector('nav'),modal=document.querySelector('dialog');
let visibleWorks = [];
let currentIndex = 0;
function showArt(index) {
  currentIndex = (index + visibleWorks.length) % visibleWorks.length;
  const work = visibleWorks[currentIndex];
  const picture = modal.querySelector('img');
  picture.src = work.img;
  picture.alt = work.title;
  modal.querySelector('h3').textContent = work.title;
  modal.querySelector('a').href = work.img;
}
modal.querySelector('.prev').onclick = () => showArt(currentIndex - 1);
modal.querySelector('.next').onclick = () => showArt(currentIndex + 1);
modal.addEventListener('keydown', event => {
  if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
  event.preventDefault();
  showArt(currentIndex + (event.key === 'ArrowLeft' ? -1 : 1));
});
function filter(tag){for(const b of nav.children)b.setAttribute('aria-pressed',b.textContent===tag);grid.replaceChildren();
visibleWorks = works.filter(w => tag === 'All' || w.category === tag);
for(const [index,w] of visibleWorks.entries()){const b=document.createElement('button'),img=document.createElement('img'),title=document.createElement('b');b.className='card';img.loading='lazy';img.src=w.thumb;img.alt='';title.textContent=w.title;b.append(img,title);b.onclick=()=>{showArt(index);modal.showModal()};grid.append(b)}}
for(const tag of ['All','Singapore Missions','Key art','Portraits','Places']){const b=document.createElement('button');b.textContent=tag;b.onclick=()=>filter(tag);nav.append(b)}filter(location.hash==='#singapore-missions'?'Singapore Missions':'All');document.querySelector('#close').onclick=()=>modal.close();modal.onclick=e=>{if(e.target===modal)modal.close()};
